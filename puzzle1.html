<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PUZZLE 1 — ANOTHER WORLD</title>

    <style>
    body {
        margin: 0;
        background: #050505;
        color: white;
        font-family: monospace;

        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
    }

    .container {
        max-width: 700px;
        padding: 40px;
    }

    h1 {
        font-size: 32px;
        letter-spacing: 8px;
        margin-bottom: 40px;
    }

    p {
        color: #888;
        font-size: 16px;
        line-height: 1.8;
    }

    .puzzle {
        margin-top: 40px;
        padding: 25px;
        border: 1px solid #333;
    }

.puzzle-image {
    width: 100%;
    max-width: 600px;
    height: auto;
    display: block;
    margin: 0 auto;
}

    input {
        margin-top: 25px;
        padding: 12px;
        background: #050505;
        color: white;
        border: 1px solid #555;
        font-family: monospace;
        text-align: center;
    }

    button {
        margin-left: 8px;
        padding: 12px 20px;
        background: #050505;
        color: white;
        border: 1px solid white;
        font-family: monospace;
        cursor: pointer;
    }

    button:hover {
        background: white;
        color: black;
    }
</style>
</head>

<body>

    <div class="container">

        <h1>What does the future hold?</h1>

        <div class="puzzle">

            <p>
                <img src="thepuzzle1.png" alt="Puzzle 1" class="puzzle-image">
            </p>

            <input type="text" id="answer" placeholder=". . .">

            <button onclick="checkAnswer()">SUBMIT</button>

            <p id="result"></p>

        </div>

    </div>

    <script>
        function checkAnswer() {
            const answer = document.getElementById("answer").value.trim().toUpperCase();

            if (answer === "SHIFT.") {
                document.getElementById("result").textContent = "GOODJOB.";
            } else {
                document.getElementById("result").textContent = "INCORRECT.";
            }
        }
    </script>

</body>
</html>
